<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>YOLO 诊断</title>
<style>
body{background:#0a1018;color:#c8d8e8;font-family:Consolas,monospace;padding:20px}
#log{background:#000;padding:16px;border-radius:8px;min-height:300px;max-height:600px;overflow-y:auto;white-space:pre-wrap;font-size:13px;line-height:1.6}
.ok{color:#0f0}.err{color:#f44}.warn{color:#fa0}.info{color:#0af}
button{padding:8px 20px;margin:8px 4px;background:#0050a0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
button:hover{background:#0060c0}
</style></head>
<body>
<h2>🔍 ONNX Runtime Web — 古建YOLO模型诊断</h2>
<button onclick="testBasic()">1. 基础检测</button>
<button onclick="testLoad()">2. 加载模型</button>
<button onclick="testInfer()">3. 推理测试</button>
<button onclick="testAll()">▶ 全部测试</button>
<div id="log"></div>

<script src="ort.min.js"></script>
<script>
var el = document.getElementById('log');
var session = null;

function log(msg, cls) {
  el.innerHTML += '<span class="'+(cls||'')+'">' + msg.replace(/</g,'&lt;') + '</span>\n';
  el.scrollTop = 99999;
}

function testBasic() {
  el.innerHTML = '';
  log('=== 1. 基础检测 ===', 'info');
  
  // Check ort
  log('typeof ort: ' + typeof ort);
  if (typeof ort === 'undefined') {
    log('❌ ort 未加载！ort.min.js 加载失败', 'err');
    return;
  }
  log('✅ ort 已加载', 'ok');
  
  // Check version
  log('ort.version: ' + (ort.version || 'undefined'));
  
  // Check env
  log('ort.env was: ' + JSON.stringify(ort.env ? Object.keys(ort.env) : 'undefined'));
  if (ort.env && ort.env.wasm) {
    log('ort.env.wasm keys: ' + JSON.stringify(Object.keys(ort.env.wasm)));
  }
  
  // Check InferenceSession
  log('typeof ort.InferenceSession: ' + typeof ort.InferenceSession);
  if (typeof ort.InferenceSession === 'function') {
    log('✅ InferenceSession 可用', 'ok');
  } else {
    log('❌ InferenceSession 不可用', 'err');
  }
  
  // Check execution providers
  try {
    var ep = ort.env.wasm ? 'wasm' : 'unknown';
    log('可用后端: ' + ep);
  } catch(e) {
    log('⚠️ 检查后端失败: ' + e.message, 'warn');
  }
  
  // Try to fetch the model file to check accessibility
  log('\n检查模型文件访问...');
  fetch('model/best.onnx', {method:'HEAD'}).then(function(r) {
    log('model/best.onnx: HTTP ' + r.status + ', size=' + r.headers.get('content-length') + ' bytes');
    if (r.ok) log('✅ 模型文件可通过HTTP访问', 'ok');
    else log('❌ 模型文件不可访问', 'err');
  }).catch(function(e) {
    log('❌ 模型文件请求失败: ' + e.message, 'err');
  });
  
  // Check WASM file
  fetch('ort-wasm-simd-threaded.wasm', {method:'HEAD'}).then(function(r) {
    log('ort-wasm-simd-threaded.wasm: HTTP ' + r.status + ', size=' + r.headers.get('content-length') + ' bytes');
    if (r.ok) log('✅ WASM文件可通过HTTP访问', 'ok');
    else log('❌ WASM文件不可访问', 'err');
  }).catch(function(e) {
    log('❌ WASM文件请求失败: ' + e.message, 'err');
  });
}

async function testLoad() {
  el.innerHTML = '';
  log('=== 2. 加载YOLO模型 ===', 'info');
  log('模型路径: model/best.onnx');
  
  if (typeof ort === 'undefined') {
    log('❌ ort 未加载，请先运行"基础检测"', 'err');
    return;
  }
  
  // Configure WASM path
  try {
    ort.env.wasm.wasmPaths = {
      'ort-wasm-simd-threaded.wasm': 'ort-wasm-simd-threaded.wasm',
      'ort-wasm-simd.wasm': 'ort-wasm-simd-threaded.wasm',
      'ort-wasm.wasm': 'ort-wasm-simd-threaded.wasm'
    };
    log('✅ WASM路径已配置', 'ok');
  } catch(e) {
    log('⚠️ WASM路径配置失败: ' + e.message, 'warn');
    // Try alternative config
    try {
      ort.env.wasm.wasmPaths = 'modules/';
      log('⚠️ 回退到字符串路径: modules/', 'warn');
    } catch(e2) {
      log('❌ WASM路径配置完全失败', 'err');
    }
  }
  
  var startTime = Date.now();
  log('开始加载模型...（103MB，可能需要10-30秒）');
  
  try {
    session = await ort.InferenceSession.create('model/best.onnx', {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'all'
    });
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    log('✅ 模型加载成功！耗时: ' + elapsed + '秒', 'ok');
    log('输入: ' + JSON.stringify(session.inputNames));
    log('输出: ' + JSON.stringify(session.outputNames));
    
    // Log input shape
    var meta = session.inputNames.map(function(n) {
      var m = session.inputMetadata ? session.inputMetadata[n] : null;
      return n + ': ' + (m ? JSON.stringify(m) : 'unknown');
    });
    log('输入元数据: ' + meta.join(', '));
  } catch(e) {
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    log('❌ 模型加载失败（' + elapsed + '秒）: ' + e.message, 'err');
    if (e.stack) log('Stack: ' + e.stack.split('\n').slice(0,3).join(' | '), 'err');
  }
}

async function testInfer() {
  el.innerHTML = '';
  log('=== 3. 推理测试 ===', 'info');
  
  if (!session) {
    log('⚠️ 模型未加载，请先运行"加载模型"', 'warn');
    log('尝试自动加载...', 'info');
    await testLoad();
    if (!session) return;
  }
  
  log('创建测试张量 (1,3,640,640)...');
  var inputSize = 640;
  var data = new Float32Array(3 * inputSize * inputSize);
  // Fill with random noise (normalized 0-1)
  for (var i = 0; i < data.length; i++) {
    data[i] = Math.random();
  }
  var tensor = new ort.Tensor('float32', data, [1, 3, inputSize, inputSize]);
  log('✅ 张量创建完成', 'ok');
  
  var startTime = Date.now();
  log('开始推理...');
  
  try {
    var results = await session.run({ images: tensor });
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    log('✅ 推理成功！耗时: ' + elapsed + '秒', 'ok');
    
    var keys = Object.keys(results);
    log('输出键: ' + JSON.stringify(keys));
    
    for (var k = 0; k < keys.length; k++) {
      var key = keys[k];
      var output = results[key];
      log('  ' + key + ': type=' + output.type + ', dims=' + JSON.stringify(output.dims) + ', size=' + output.data.length);
      
      // Sample first few values
      var sample = [];
      for (var s = 0; s < Math.min(10, output.data.length); s++) {
        sample.push(output.data[s].toFixed(4));
      }
      log('  前10个值: [' + sample.join(', ') + ']');
    }
    
    log('\n🎉 一切正常！YOLO模型可以正常加载和推理。', 'ok');
    log('如果大屏不工作，请检查app.js中startYoloInference函数的调用时机。');
  } catch(e) {
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    log('❌ 推理失败（' + elapsed + '秒）: ' + e.message, 'err');
    if (e.stack) log('Stack: ' + e.stack.split('\n').slice(0,3).join(' | '), 'err');
  }
}

async function testAll() {
  testBasic();
  setTimeout(async function() {
    await testLoad();
    await testInfer();
  }, 500);
}
</script>
</body></html>
